  <path d="M680 640 Q820 700 1015 568" stroke="#C46DFF" stroke-width="1.3" stroke-opacity=".22" stroke-dasharray="5 8" fill="none"/>
  <path d="M300 420 Q600 260 900 420" stroke="#7C6BFF" stroke-width="1.15" stroke-opacity=".16" stroke-dasharray="4 9" fill="none"/>

