<svg width="1200" height="780" viewBox="0 0 1200 780" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="netGrad" x1="60" y1="40" x2="1140" y2="740" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55E3FF"/>
      <stop offset=".48" stop-color="#7C6BFF"/>
      <stop offset="1" stop-color="#C46DFF"/>
    </linearGradient>
    <linearGradient id="cardFace" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0E1B2E"/>
      <stop offset="1" stop-color="#0A1422"/>
    </linearGradient>
    <linearGradient id="hubFace" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101C30"/>
      <stop offset="1" stop-color="#0B1524"/>
    </linearGradient>
    <radialGradient id="inetGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 108) scale(160)">
      <stop stop-color="#7DD3FC" stop-opacity=".4"/>
      <stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hubGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 360) scale(120)">
      <stop stop-color="#8B7CFF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#8B7CFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <!-- ambient -->
  <circle cx="600" cy="390" r="260" fill="#7CDFFF" fill-opacity=".045"/>
