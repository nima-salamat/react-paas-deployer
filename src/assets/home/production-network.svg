  <circle cx="600" cy="360" r="110" fill="url(#hubGlow)" filter="url(#softBlur)"/>

  <!-- faint grid -->
  <g opacity=".07" stroke="#9EC9E8" stroke-width="1">
    <path d="M80 200h1040M80 320h1040M80 440h1040M80 560h1040M80 680h1040"/>
    <path d="M200 60v660M360 60v660M520 60v660M680 60v660M840 60v660M1000 60v660"/>
  </g>

  <!-- INTERNET -->
