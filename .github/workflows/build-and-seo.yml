name: Build and SEO

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-seo:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Auth session regression tests
        run: npm run test:auth

      - name: Service detail regression tests
        run: npm run test:service-detail

      - name: Agent regression tests
        run: npm run test:agents

      - name: Ticket editor regression tests
        run: npm run test:ticket-editor

      - name: Ready App component import regression tests
        run: npm run test:ready-apps

      - name: Resource Plans admin regression tests
        run: npm run test:plans-admin

      - name: React runtime binding regression tests
        run: npm run test:runtime-bindings

      - name: Frontend source integrity tests
        run: npm run test:source-integrity

      - name: Frontend domain contract tests
        run: npm run test:domain-contracts

      - name: Frontend admin surface tests
        run: npm run test:admin-surface

      - name: Frontend API contract tests
        run: npm run test:api-contracts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Server shell smoke test
        run: node scripts/server-smoke.mjs

      - name: Validate SEO output
        run: npm run seo:check
