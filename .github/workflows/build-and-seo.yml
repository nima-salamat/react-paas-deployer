name: Build and SEO

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-seo:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Benchmark Vite 8 build
        run: |
          rm -rf dist-vite8
          npm install --no-save --package-lock=false vite@8.3.0 @vitejs/plugin-react@6.1.1 --ignore-scripts
          /usr/bin/time -f "VITE8_BUILD_SECONDS=%e" npx --no-install vite build --outDir dist-vite8

      - name: Build
        run: npm run build

      - name: Validate SEO output
        run: npm run seo:check
