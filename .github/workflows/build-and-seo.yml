name: Build and SEO

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-seo:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Auth session regression tests
        run: npm run test:auth

      - name: Service detail regression tests
        run: npm run test:service-detail

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Server shell smoke test
        run: node scripts/server-smoke.mjs

      - name: Validate SEO output
        run: npm run seo:check
