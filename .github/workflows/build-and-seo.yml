name: Build and SEO

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-seo:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check Messenger for use-before-definition
        run: npx eslint src/components/messenger/MessengerApp.jsx --rule 'no-use-before-define: [error, { functions: false, classes: true, variables: true }]'

      - name: Validate SEO output
        run: npm run seo:check
