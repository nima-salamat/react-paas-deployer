name: Build and SEO

on:
  push:
    branches:
      - main
    - fix/frontend-runtime-and-build-20260924
  pull_request:

jobs:
  build-and-seo:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Inspect prerender output
        run: |
          echo "HTML files:"
          find dist -maxdepth 2 -type f -name '*.html' -print | sort
          echo "Canonical counts:"
          for file in $(find dist -maxdepth 2 -type f -name '*.html' | sort); do
            printf '%s: ' "$file"
            grep -Eio '<link[^>]+rel="canonical"[^>]*>' "$file" | wc -l
          done
          echo "Root head:"
          sed -n '1,120p' dist/index.html

      - name: Validate SEO output
        run: npm run seo:check
