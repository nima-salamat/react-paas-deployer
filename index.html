<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#081325" />
  <meta name="color-scheme" content="dark light" />
  <meta name="author" content="PassDeployer" />
  <meta name="application-name" content="PassDeployer" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" type="image/x-icon" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; }
    html { background: #f7f9fc; }
    body { min-height: 100vh; background: #f7f9fc; }
    #root { min-height: 100vh; }
    .app-loading { min-height: 100vh; display: grid; place-items: center; background: #f7f9fc; }
    .app-loading__spinner { width: 28px; height: 28px; border: 3px solid rgba(47, 102, 255, 0.16); border-top-color: #2f66ff; border-radius: 50%; animation: app-loading-spin .8s linear infinite; }
    @keyframes app-loading-spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      html, body, .app-loading { background: #0b1020; }
      .app-loading__spinner { border-color: rgba(138, 180, 255, 0.18); border-top-color: #8ab4ff; }
    }
    @media (prefers-reduced-motion: reduce) {
      .app-loading__spinner { animation-duration: 1.8s; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="app-loading" aria-busy="true" aria-live="polite">
      <div class="app-loading__spinner" role="status" aria-label="Loading PassDeployer"></div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
  <noscript>
    <main style="max-width: 760px; margin: 0 auto; padding: 48px 20px; font-family: system-ui, sans-serif;">
      <h1>Deploy applications with PassDeployer</h1>
      <p>PassDeployer is a focused platform for deploying applications and managing services, resources, networks and persistent storage.</p>
      <nav aria-label="Primary">
        <a href="/">Home</a> ·
        <a href="/plans">Plans</a> ·
        <a href="/aboutUs">About</a> ·
        <a href="/signin_or_signup">Sign in</a>
      </nav>
    </main>
  </noscript>
</body>
</html>
