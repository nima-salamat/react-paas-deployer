<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#081325" />
  <meta name="color-scheme" content="dark light" />
  <meta name="author" content="PassDeployer" />
  <meta name="application-name" content="PassDeployer" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" type="image/x-icon" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; }
    body { min-height: 100vh; }
    #root { min-height: 100vh; }
    .seo-page { min-height: 100vh; box-sizing: border-box; padding: 48px 20px; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #111827; background: #f7f9fc; }
    .seo-container { max-width: 980px; margin: 0 auto; }
    .seo-breadcrumbs { display: flex; gap: 8px; align-items: center; font-size: 14px; margin-bottom: 28px; }
    .seo-page h1 { max-width: 900px; margin: 0 0 18px; font-size: clamp(2.5rem, 6vw, 4.8rem); line-height: 1; letter-spacing: -0.05em; }
    .seo-lead { max-width: 760px; font-size: 1.15rem; line-height: 1.8; color: #475569; }
    .seo-sections { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 48px; }
    .seo-sections article { padding: 22px; border: 1px solid #dbe3ef; border-radius: 18px; background: #fff; }
    .seo-sections h2 { margin: 0 0 10px; font-size: 1.25rem; }
    .seo-sections p { margin: 0; color: #526173; line-height: 1.7; }
    .seo-links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 42px; }
    .seo-links a { display: inline-block; padding: 10px 14px; border-radius: 10px; background: #e9efff; color: #2456d3; text-decoration: none; font-weight: 650; }
    @media (max-width: 820px) { .seo-sections { grid-template-columns: 1fr; } }
    @media (prefers-color-scheme: dark) {
      .seo-page { color: #e5e7eb; background: #0b1020; }
      .seo-sections article { background: #111827; border-color: #273449; }
      .seo-lead, .seo-sections p { color: #94a3b8; }
      .seo-links a { background: #15284d; color: #9fc0ff; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
