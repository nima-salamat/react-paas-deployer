<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#081325" />
  <meta name="color-scheme" content="dark" />
  <meta name="author" content="PassDeployer" />

  <!--
    Title & description are injected by prerender (vite-prerender-plugin)
    and react-helmet-async at runtime. Keeping only one set avoids
    duplicate meta description tags reported by SEO checkers.
    Fallback values below are used only if prerender/Helmet do not run.
  -->
  <title>PassDeployer | Deploy Apps Easily</title>
  <meta
    name="description"
    content="PassDeployer helps you deploy and manage Django, Node.js, Flask and Docker apps. Simple PaaS for developers — start, stop, scale and monitor in one place."
  />

  <meta name="robots" content="index, follow, max-image-preview:large" />
  <meta name="googlebot" content="index, follow, max-image-preview:large" />

  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #0a0a0a;
      color: #fff;
    }

    body {
      min-height: 100vh;
    }

    #root {
      min-height: 100vh;
    }

    /* Boot shell: dark full-screen while JS loads / hydrates */
    #app-boot-shell {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #fff;
    }

    .app-boot-spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #fff;
      animation: app-boot-spin 0.75s linear infinite;
    }

    @keyframes app-boot-spin {
      to {
        transform: rotate(360deg);
      }
    }

    /*
      SEO shell: keep heading/paragraph/links in the DOM for crawlers,
      but hide them from sighted users (clip technique, not display:none).
    */
    #prerender-seo-shell {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>

<body>
  <div id="root">
    <!-- Fallback for non-prerendered routes: dark screen + spinner -->
    <div id="app-boot-shell" aria-busy="true" aria-live="polite">
      <div class="app-boot-spinner" role="status" aria-label="Loading"></div>
    </div>
  </div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
