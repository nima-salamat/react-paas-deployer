<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Basic -->
    <meta name="theme-color" content="#081325" />
    <meta name="color-scheme" content="dark" />
    <meta name="author" content="PassDeployer" />

    <!-- Default / fallback SEO -->
    <title>
      PassDeployer | Deploy Django, Node.js, Flask & Docker Applications
    </title>

    <meta
      name="description"
      content="Deploy and manage Django, Node.js, Flask, and Docker applications with PassDeployer."
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large"
    />

    <!-- Favicons -->
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="any"
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/icon.svg"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: #0a0a0a;
        color: #fff;
      }

      body {
        min-height: 100vh;
      }

      #root {
        min-height: 100vh;
      }

      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        z-index: 99999;
      }

      .boot-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #fff;
        border-radius: 50%;
        animation: boot-spin 0.75s linear infinite;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div
        class="boot-splash"
        aria-busy="true"
        aria-label="Loading"
      >
        <div class="boot-spinner"></div>
      </div>
    </div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
