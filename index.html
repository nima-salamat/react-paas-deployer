<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#081325" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

   
    <title><%= VITE_APP_NAME %></title>

    <meta
      name="description"
      content="<%= VITE_APP_DESCRIPTION %>"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="<%= VITE_APP_NAME %>" />
    <meta property="og:title" content="<%= VITE_APP_NAME %>" />
    <meta property="og:description" content="<%= VITE_APP_DESCRIPTION %>" />
    <meta property="og:url" content="<%= VITE_APP_URL %>" />
    <meta property="og:image" content="<%= VITE_APP_PREVIEW %>" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="<%= VITE_APP_NAME %>" />
    <meta name="twitter:description" content="<%= VITE_APP_DESCRIPTION %>" />
    <meta name="twitter:image" content="<%= VITE_APP_PREVIEW %>" />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0a0a0a;
        color: #fff;
      }
      #root {
        min-height: 100%;
      }
      /* Shown only until React mounts and replaces #root contents */
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        z-index: 99999;
      }
      .boot-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #fff;
        border-radius: 50%;
        animation: boot-spin 0.75s linear infinite;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="boot-splash" aria-busy="true" aria-label="Loading">
        <div class="boot-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
